# Risk limits for the order gateway.
#
# Loaded with:  ./build/gateway --risk config/risk.conf
#
# Unknown keys are a startup ERROR rather than a warning. A typo'd limit that
# silently keeps its default is the kind of thing you discover from a fill.

# --- enforced on the NETWORK thread ---------------------------------------
# These need no book state, so an over-limit client is refused before it can
# consume queue capacity or matching-thread time that other sessions need.

# Sustained orders per second, per session.
rate_per_sec = 1000

# Burst allowance. Above rate_per_sec on purpose: real clients re-quote a whole
# ladder at once and then go quiet, and a limiter that refuses that is wrong
# about the workload.
rate_burst = 2000

# --- enforced on the MATCHING thread --------------------------------------
# The price band is relative to the last trade or the mid, and only the matching
# thread may read the book. That check cannot live anywhere else.

max_order_qty = 1000000

# Minimum price increment in ticks. 1 = every tick is valid (the check is a
# no-op). Prices are int64 tick counts, so alignment is exact integer modulo —
# never a floating-point epsilon.
tick_size = 1

# Reject limit orders further than this from the reference price, in basis
# points. 1000 bp = 10%. Reference is the last trade, else the mid; with
# neither, no band is applied — an empty book with no trades has no opinion
# about what a reasonable price is.
price_band_bp = 1000
