# Risk limits for BENCHMARKING only.
#
# The production defaults cap a session at 1000 orders/sec, which is below the
# rates the latency sweep drives — measuring the rate limiter rather than the
# matching path. These limits are deliberately far above anything the sweep
# offers so that what is measured is the gateway, not its own throttle.
#
# Not a recommended production configuration.

rate_per_sec  = 10000000
rate_burst    = 10000000
max_order_qty = 1000000
tick_size     = 1

# Disabled: the sweep quotes far from the last trade by design, and a band
# rejection would replace a matched order with a cheap reject, flattering the
# latency number.
price_band_bp = 0
