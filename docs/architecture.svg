<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .paper { fill: #fbfaf7; stroke: #111; stroke-width: 2; }
    .thread { fill: #f2efe6; stroke: #111; stroke-width: 2; }
    .store  { fill: #fff; stroke: #111; stroke-width: 2; stroke-dasharray: 5 3; }
    .lbl    { font-size: 12px; fill: #111; letter-spacing: .06em; }
    .lbl b  { font-weight: 700; }
    .title  { font-size: 12px; fill: #111; font-weight: 700; letter-spacing: .10em; }
    .small  { font-size: 10px; fill: #555; }
    .flow   { stroke: #2f6db3; stroke-width: 2; fill: none; marker-end: url(#a); }
    .back   { stroke: #b34a2f; stroke-width: 2; fill: none; marker-end: url(#b); }
    .note   { font-size: 10px; fill: #2f6db3; }
    .noteb  { font-size: 10px; fill: #b34a2f; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b34a2f"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fff"/>

  <!-- clients -->
  <rect class="paper" x="16" y="150" width="112" height="120" rx="3"/>
  <text class="title" x="72" y="176" text-anchor="middle">CLIENTS</text>
  <text class="lbl"   x="72" y="200" text-anchor="middle">TCP</text>
  <text class="small" x="72" y="222" text-anchor="middle">orders in</text>
  <text class="small" x="72" y="238" text-anchor="middle">acks, fills,</text>
  <text class="small" x="72" y="252" text-anchor="middle">book updates out</text>

  <!-- gateway process boundary -->
  <rect x="168" y="26" width="600" height="418" rx="4" fill="none" stroke="#111"
        stroke-width="2" stroke-dasharray="2 4"/>
  <text class="title" x="184" y="48">GATEWAY PROCESS</text>

  <!-- network thread -->
  <rect class="thread" x="192" y="150" width="150" height="120" rx="3"/>
  <text class="title" x="267" y="176" text-anchor="middle">NETWORK</text>
  <text class="title" x="267" y="192" text-anchor="middle">THREAD</text>
  <text class="small" x="267" y="216" text-anchor="middle">poll() loop</text>
  <text class="small" x="267" y="232" text-anchor="middle">framing</text>
  <text class="small" x="267" y="248" text-anchor="middle">sessions</text>
  <text class="small" x="267" y="264" text-anchor="middle">rate limit</text>

  <!-- matching thread -->
  <rect class="thread" x="520" y="150" width="160" height="120" rx="3"/>
  <text class="title" x="600" y="176" text-anchor="middle">MATCHING</text>
  <text class="title" x="600" y="192" text-anchor="middle">THREAD</text>
  <text class="small" x="600" y="216" text-anchor="middle">THE BOOK</text>
  <text class="small" x="600" y="232" text-anchor="middle">single writer</text>
  <text class="small" x="600" y="248" text-anchor="middle">risk: price band</text>
  <text class="small" x="600" y="264" text-anchor="middle">order → session map</text>

  <!-- queues -->
  <rect class="store" x="368" y="120" width="126" height="40" rx="3"/>
  <text class="lbl"   x="431" y="138" text-anchor="middle">SPSC queue</text>
  <text class="small" x="431" y="152" text-anchor="middle">OrderCommand</text>

  <rect class="store" x="368" y="262" width="126" height="40" rx="3"/>
  <text class="lbl"   x="431" y="280" text-anchor="middle">SPSC per session</text>
  <text class="small" x="431" y="294" text-anchor="middle">OrderEvent</text>

  <rect class="store" x="368" y="322" width="126" height="40" rx="3"/>
  <text class="lbl"   x="431" y="340" text-anchor="middle">SPSC per session</text>
  <text class="small" x="431" y="354" text-anchor="middle">BookSnapshot</text>

  <!-- durability -->
  <rect class="store" x="540" y="326" width="120" height="42" rx="3"/>
  <text class="lbl"   x="600" y="344" text-anchor="middle">WAL</text>
  <text class="small" x="600" y="358" text-anchor="middle">group commit</text>

  <rect class="store" x="540" y="384" width="120" height="42" rx="3"/>
  <text class="lbl"   x="600" y="402" text-anchor="middle">SNAPSHOT</text>
  <text class="small" x="600" y="416" text-anchor="middle">temp+fsync+rename</text>

  <!-- flows: client -> network -> queue -> matching -->
  <path class="flow" d="M128,196 L188,196"/>
  <path class="flow" d="M342,180 L360,180 L360,140 L364,140"/>
  <path class="flow" d="M494,140 L512,140 L512,180 L516,180"/>

  <!-- back: matching -> egress -> network -> client -->
  <path class="back" d="M540,274 L512,274 L512,282 L498,282"/>
  <path class="back" d="M364,282 L350,282 L350,238 L346,238"/>
  <path class="back" d="M188,224 L132,224"/>

  <!-- market data: matching -> per-session snapshot queue -> network.
       Routed left of the durability boxes so it cannot be misread as coming
       out of the WAL. -->
  <path class="back" d="M524,262 L508,262 L508,342 L498,342"/>
  <path class="back" d="M364,342 L352,342 L352,256 L346,256"/>

  <!-- durability writes, both straight down from the matching thread -->
  <path class="flow" d="M580,274 L580,322"/>
  <path class="flow" d="M640,274 L640,300 L700,300 L700,405 L664,405"/>

  <!-- annotations -->
  <text class="note"  x="431" y="112" text-anchor="middle">every command crosses here</text>
  <text class="noteb" x="300" y="404">order flow: never dropped</text>
  <text class="noteb" x="300" y="420">slow consumer → disconnect</text>
  <text class="noteb" x="300" y="440">market data: conflated, latest wins</text>
  <text class="note"  x="712" y="266">append</text>
  <text class="note"  x="712" y="280">BEFORE apply</text>

  <text class="small" x="184" y="70">the network thread never touches the book</text>
</svg>
